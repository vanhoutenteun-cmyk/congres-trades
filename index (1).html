<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Congres Trades</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#ffffff;--surface-2:#eef0f3;--border:#dde1e6;
  --text:#151a21;--muted:#566170;--accent:#2a56c6;
  --pos:#126b34;--pos-bg:#e3f2e8;--neg:#b0261c;--neg-bg:#fbe9e7;
  --koop:#2a56c6;--verk:#b85a0a;--warn:#7a4a00;--warn-bg:#fdf1dc;
  --spx:#7b8594;--shadow:0 1px 2px rgba(15,20,30,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1115;--surface:#161a20;--surface-2:#1e232b;--border:#2a313b;
    --text:#e6e9ed;--muted:#9ba5b3;--accent:#86a8ff;
    --pos:#5fcf8a;--pos-bg:rgba(95,207,138,.13);--neg:#ff8a7e;--neg-bg:rgba(255,138,126,.13);
    --koop:#86a8ff;--verk:#f2a55a;--warn:#f5c26b;--warn-bg:rgba(245,194,107,.13);
    --spx:#8d97a6;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1115;--surface:#161a20;--surface-2:#1e232b;--border:#2a313b;
  --text:#e6e9ed;--muted:#9ba5b3;--accent:#86a8ff;
  --pos:#5fcf8a;--pos-bg:rgba(95,207,138,.13);--neg:#ff8a7e;--neg-bg:rgba(255,138,126,.13);
  --koop:#86a8ff;--verk:#f2a55a;--warn:#f5c26b;--warn-bg:rgba(245,194,107,.13);
  --spx:#8d97a6;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{display:flex;align-items:center;gap:6px;border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;min-height:40px;white-space:nowrap}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--text);font-weight:600}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:8px;min-width:40px;min-height:40px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--text)}
.iconbtn svg{width:18px;height:18px}
main{max-width:1280px;margin:0 auto;padding:16px 16px 40px}
.banner{max-width:1280px;margin:12px auto 0;padding:0 16px}
.banner div{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px}
.panel[hidden]{display:none}
h2{font-size:20px;margin:4px 0 14px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile .lbl{font-size:12.5px;color:var(--muted)}
.tile .val{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.2;margin-top:4px}
.tile .sub{font-size:13px;color:var(--muted);margin-top:2px}
.tile.click{cursor:pointer}
.tile.click:hover{border-color:var(--accent)}
.two{grid-template-columns:3fr 2fr}
.stack{display:flex;flex-direction:column;gap:12px}
.mt{margin-top:16px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.na{color:var(--muted)}
.pill{display:inline-block;font-size:12px;line-height:1;padding:4px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.sig{background:var(--warn-bg);color:var(--warn)}
.pill.koop{background:color-mix(in srgb,var(--koop) 14%,transparent);color:var(--koop);font-weight:600}
.pill.verkoop{background:color-mix(in srgb,var(--verk) 16%,transparent);color:var(--verk);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pct{display:inline-block;padding:2px 6px;border-radius:6px;font-weight:600}
.pct.pos{background:var(--pos-bg)}.pct.neg{background:var(--neg-bg)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:800px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);position:sticky;top:0}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td,tr.click:focus td{background:var(--surface-2)}
tr.click:focus{outline:none}
tr.click:focus-visible td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.sortbtn{border:0;background:none;padding:0;font-weight:600;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center;text-align:left}
.sortbtn:hover{color:var(--text)}
.th-r .sortbtn{justify-content:flex-end}
.tick{font-weight:650}
.star{border:0;background:none;cursor:pointer;color:var(--muted);padding:0;width:32px;height:32px;display:inline-grid;place-items:center;border-radius:6px;vertical-align:middle;margin:-6px 0}
.star:hover{background:var(--surface-2)}
.star svg{width:17px;height:17px}
.star[aria-pressed="true"]{color:#d49b00}
.star[aria-pressed="true"] svg{fill:currentColor}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.filters select{min-height:40px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;min-height:40px;padding:0 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.rowbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--border)}
.list li:last-child{border-bottom:0}
.listbtn{all:unset;display:block;width:100%;cursor:pointer;border-radius:6px}
.listbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.bars .row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:6px 0}
.bar{display:flex;flex-direction:column;gap:3px}
.bar span{display:block;height:10px;border-radius:3px;min-width:2px}
.bar .b-k{background:var(--koop)}.bar .b-v{background:var(--verk)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.heat{min-width:760px}
.heat td,.heat th{text-align:center;padding:8px 6px;font-size:13px}
.heat td:first-child,.heat th:first-child{text-align:left;padding-left:12px}
.note{margin-top:24px;padding:14px 16px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.note strong{color:var(--text)}
.note ul{margin:6px 0 0;padding-left:18px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kv div span{display:block;font-size:12.5px;color:var(--muted)}
.kv div b{font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,12,16,.5)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 16px 0}
.dlg-b{padding:12px 16px 18px;overflow:auto}
.chart svg{width:100%;height:auto;display:block}
.chart .grid line{stroke:var(--border)}
.chart text{fill:var(--muted);font-size:11px}
.chart .l-stock{stroke:var(--accent);stroke-width:2;fill:none}
.chart .zero{stroke:var(--muted);stroke-width:1;opacity:.6}
.chart .m-tx{stroke:var(--koop);stroke-width:1.5}
.chart .m-mel{stroke:var(--verk);stroke-width:1.5;stroke-dasharray:3 3}
@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom));justify-content:space-around;z-index:30}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;flex:1;min-height:52px;justify-content:center}
  .tab[aria-selected="true"]{background:none;color:var(--accent)}
  main{padding-bottom:96px}
  .tile .val{font-size:22px}
  .bars .row{grid-template-columns:110px 1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Congres Trades</h1>
      <p id="updated">Laden…</p>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Tabbladen"></nav>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Thema wisselen" title="Thema wisselen"></button>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<main id="main">
  <section class="panel" id="p-overzicht" role="tabpanel"></section>
  <section class="panel" id="p-trades" role="tabpanel" hidden>
    <h2>Trades</h2>
    <div class="filters" id="filters"></div>
    <div id="tradesOut"></div>
  </section>
  <section class="panel" id="p-politici" role="tabpanel" hidden></section>
  <section class="panel" id="p-sectoren" role="tabpanel" hidden></section>
  <section class="panel" id="p-ongebruikelijk" role="tabpanel" hidden></section>
  <section class="panel" id="p-volglijst" role="tabpanel" hidden></section>
</main>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === null || v === undefined || v === '') return null; const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) && n > 0 ? n : null; };
const pct = (a, b) => (a && b) ? (b / a - 1) * 100 : null;
const DAY = 864e5;
const toD = s => new Date(s + 'T00:00:00Z');
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => iso(new Date(toD(s).getTime() + n * DAY));
const daysBetween = (a, b) => Math.round((toD(b) - toD(a)) / DAY);
const dfmt = new Intl.DateTimeFormat('nl-NL', {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'});
const mfmt = new Intl.DateTimeFormat('nl-NL', {month:'short', year:'2-digit', timeZone:'UTC'});
const dmfmt = new Intl.DateTimeFormat('nl-NL', {day:'numeric', month:'short', timeZone:'UTC'});
const fmtDate = s => s ? dfmt.format(toD(s)) : '–';
const fmtPct = v => v == null ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('nl-NL', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
const fmtNum = (v, d=2) => v == null ? '–' : v.toLocaleString('nl-NL', {minimumFractionDigits:d, maximumFractionDigits:d});
const cls = v => v == null ? 'na' : v > 0 ? 'pos' : v < 0 ? 'neg' : '';
const pctCell = v => v == null ? '<span class="na">–</span>' : `<span class="pct ${cls(v)}">${fmtPct(v)}</span>`;
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const KAMER = {House:'Huis', Senate:'Senaat'};
const kamerNl = k => KAMER[k] || k || '–';

const ICON = {
  overzicht:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  trades:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  politici:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.3 0 4 1.4 4.5 4"/></svg>',
  sectoren:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v9h9"/><path d="M20.5 15A9 9 0 1 1 9 3.5"/></svg>',
  ongebruikelijk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>',
  volglijst:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5z" fill="currentColor"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>'
};
const TABS = [
  ['overzicht','Overzicht'],['trades','Trades'],['politici','Politici'],
  ['sectoren','Sectoren'],['ongebruikelijk','Ongebruikelijk'],['volglijst','Volglijst']
];

/* ---------- state ---------- */
const S = {
  tab: store.get('ct.tab', 'overzicht'),
  sort: {
    trades:{k:'tx', d:-1}, detail:{k:'tx', d:-1}, unusual:{k:'mel', d:-1},
    watch:{k:'tx', d:-1}, pols:{k:'n', d:-1}, wpols:{k:'n', d:-1}
  },
  f: {pol:'', ticker:'', sector:'', type:'', kamer:'', partij:'', periode:'all'},
  polDetail: null,
  sigFilter: '',
  secPeriod: '365',
  watch: store.get('ct.watch', {pol:[], tic:[]}),
  theme: store.get('ct.theme', 'auto')
};
if (!S.watch || !Array.isArray(S.watch.pol) || !Array.isArray(S.watch.tic)) S.watch = {pol:[], tic:[]};
if (!TABS.some(t => t[0] === S.tab)) S.tab = 'overzicht';
let D = null;

/* ---------- theme ---------- */
function applyTheme(){
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
  const b = $('#themeBtn');
  b.innerHTML = ICON[S.theme === 'auto' ? 'auto' : S.theme === 'dark' ? 'moon' : 'sun'];
  const label = {auto:'Thema: automatisch', light:'Thema: licht', dark:'Thema: donker'}[S.theme];
  b.setAttribute('aria-label', label + ' (klik om te wisselen)'); b.title = label;
}
$('#themeBtn').addEventListener('click', () => {
  S.theme = {auto:'light', light:'dark', dark:'auto'}[S.theme] || 'auto';
  store.set('ct.theme', S.theme); applyTheme();
});
applyTheme();

/* ---------- sample data (fictief) ---------- */
function makeSample(){
  let seed = 20261111;
  const r = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(r() * a.length)];
  const gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const end = iso(new Date());
  const days = [];
  for (let d = addDays(end, -520); d <= end; d = addDays(d, 1)) { const w = toD(d).getUTCDay(); if (w && w < 6) days.push(d); }
  const series = (p0, mu, sig) => { let p = p0; return days.map(d => { p *= Math.exp(mu / 252 - sig * sig / 504 + sig / Math.sqrt(252) * gauss()); return {datum:d, slotkoers:Math.round(p * 100) / 100}; }); };
  const T = [
    ['QNTX','Quantix Systems','Technologie',140,.22,.34],['LMNA','Lumina Semiconductor','Technologie',88,.28,.45],
    ['CLDV','Cloudvale Software','Technologie',62,.08,.38],['ARVN','Aerovan Defense','Defensie',210,.16,.24],
    ['STLW','Steelward Dynamics','Defensie',74,.12,.28],['PTRA','Petra Energy','Energie',55,.02,.30],
    ['SOLN','Solnova Power','Energie',31,-.05,.48],['MEDQ','Medique Health','Gezondheidszorg',118,.07,.22],
    ['GNVX','Genovex Biotech','Gezondheidszorg',46,.04,.55],['HRBK','Harborline Bank','Financiën',39,.09,.25],
    ['CPTL','Capitol Ridge Financial','Financiën',152,.12,.22],['BRNX','Brightmart Retail','Consument',67,.03,.26],
    ['FZZY','Fizzco Beverages','Consument',58,.05,.17],['TRKL','Trackline Rail','Industrie',96,.06,.21],
    ['MCHN','Machinery Union','Industrie',134,.10,.25],['SGNL','Signalwave Media','Communicatie',23,-.02,.40],
    ['GRDW','Gridwell Utilities','Nutsbedrijven',71,.05,.15],['CPRM','Copperhill Mining','Grondstoffen',42,.11,.36]
  ];
  const koershistorie = {};
  T.forEach(t => { koershistorie[t[0]] = series(t[3], t[4], t[5]); });
  const C2S = {
    'Armed Services':['Defensie','Industrie'], 'Financial Services':['Financiën'], 'Banking':['Financiën'],
    'Energy and Commerce':['Energie','Gezondheidszorg','Communicatie'], 'Intelligence':['Technologie','Defensie'],
    'Agriculture':['Grondstoffen','Consument'], 'Health, Education, Labor and Pensions':['Gezondheidszorg'],
    'Transportation and Infrastructure':['Industrie','Nutsbedrijven'], 'Ways and Means':['Consument','Financiën'],
    'Science, Space, and Technology':['Technologie','Communicatie']
  };
  const P = [
    ['Dana Whitfield','D','House','CA',['Intelligence','Science, Space, and Technology']],
    ['Marcus Ellery','R','Senate','TX',['Armed Services','Energy and Commerce']],
    ['Rosa Delgado-Finch','D','House','NM',['Energy and Commerce']],
    ['Gregory Halvorsen','R','House','MN',['Agriculture','Transportation and Infrastructure']],
    ['Priya Castellano','D','Senate','NJ',['Banking','Health, Education, Labor and Pensions']],
    ['Walter Quimby','R','House','OH',['Financial Services']],
    ['Hannah Leclerc','D','House','WA',['Science, Space, and Technology','Ways and Means']],
    ['Victor Ashdown','R','Senate','GA',['Armed Services','Intelligence']],
    ['Ellen Marsh-Tanaka','D','House','HI',['Transportation and Infrastructure']],
    ['Raymond Kittredge','R','House','FL',['Financial Services','Ways and Means']],
    ['Corinne Abernathy','I','Senate','VT',['Health, Education, Labor and Pensions','Agriculture']],
    ['Silas Montrose','R','House','AZ',['Energy and Commerce','Armed Services']]
  ];
  const politici = P.map((p, i) => ({id:'p' + (i + 1), naam:p[0], partij:p[1], kamer:p[2], staat:p[3], commissies:p[4]}));
  const prefs = politici.map(p => p.commissies.flatMap(c => C2S[c] || []));
  const ranges = ['$1.001–$15.000','$15.001–$50.000','$50.001–$100.000','$100.001–$250.000','$250.001–$500.000','$500.001–$1.000.000','$1.000.001–$5.000.000'];
  const rw = [30,28,16,12,7,4,3];
  const pickRange = () => { let x = r() * 100, i = 0; while (x > rw[i] && i < rw.length - 1) { x -= rw[i]; i++; } return i; };
  const close = (t, d) => { const h = koershistorie[t]; let c = null; for (const x of h) { if (x.datum <= d) c = x.slotkoers; else break; } return c; };
  const trades = [];
  const add = (pi, tk, type, idx, delayForce) => {
    const t = T.find(x => x[0] === tk);
    const tx = days[Math.max(0, Math.min(days.length - 2, idx))];
    const delay = delayForce != null ? delayForce : (r() < .1 ? 46 + Math.floor(r() * 35) : 3 + Math.floor(r() * 40));
    let mel = addDays(tx, delay); if (mel > end) mel = end;
    const ri = pickRange();
    trades.push({politicus_id:politici[pi].id, type, ticker:tk, bedrijf:t[1], sector:t[2], bedrag_range:ranges[ri], _ri:ri,
      transactiedatum:tx, meldingsdatum:mel, koers_transactie:close(tk, tx), koers_melding:close(tk, mel),
      koers_nu:koershistorie[tk][koershistorie[tk].length - 1].slotkoers, signalen:[]});
  };
  for (let i = 0; i < 165; i++) {
    const pi = Math.floor(r() * politici.length);
    const sec = r() < .65 && prefs[pi].length ? pick(prefs[pi]) : null;
    const cand = T.filter(t => !sec || t[2] === sec);
    const t = pick(cand.length ? cand : T);
    add(pi, t[0], r() < .58 ? 'koop' : 'verkoop', days.length - 3 - Math.floor(Math.pow(r(), 1.15) * 300));
  }
  // bewuste clusters
  [['LMNA', [0,7,6,1], 34], ['ARVN', [1,7,11], 18], ['PTRA', [2,11,3], 62]].forEach(([tk, ps, back]) => {
    ps.forEach((pi, j) => add(pi, tk, 'koop', days.length - back - j * 2, 12 + j * 5));
  });
  // signalen
  trades.forEach(tr => {
    if (tr._ri >= 4) tr.signalen.push('groot bedrag');
    if (daysBetween(tr.transactiedatum, tr.meldingsdatum) > 45) tr.signalen.push('late melding');
    const others = trades.filter(o => o !== tr && o.ticker === tr.ticker && o.politicus_id !== tr.politicus_id && Math.abs(daysBetween(o.transactiedatum, tr.transactiedatum)) <= 14);
    if (others.length) tr.signalen.push('cluster');
    delete tr._ri;
  });
  // voorbeeld van een onbekende koers
  trades.push({politicus_id:'p10', type:'koop', ticker:'PRVH', bedrijf:'Privéhaven Holdings (niet beursgenoteerd)', sector:'Financiën',
    bedrag_range:'$15.001–$50.000', transactiedatum:addDays(end, -40), meldingsdatum:addDays(end, -6),
    koers_transactie:null, koers_melding:null, koers_nu:null, signalen:[]});
  return {laatst_bijgewerkt:new Date().toISOString(), politici, trades, koershistorie};
}

/* ---------- prepare ---------- */
function closeOn(arr, date){
  if (!arr || !arr.length || !date || date < arr[0].d) return null;
  let lo = 0, hi = arr.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (arr[m].d <= date) lo = m; else hi = m - 1; }
  return arr[lo].c;
}
function prepare(raw){
  const normH = a => (Array.isArray(a) ? a : []).map(x => ({d:String(x && x.datum || '').slice(0, 10), c:num(x && x.slotkoers)}))
    .filter(x => x.d && x.c).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
  const hist = {};
  const kh = raw.koershistorie || {};
  Object.keys(kh).forEach(k => { hist[k.toUpperCase()] = normH(kh[k]); });
  const pols = (Array.isArray(raw.politici) ? raw.politici : []).map(p => ({
    id:String(p.id), naam:p.naam || 'Onbekend', partij:p.partij || '–', kamer:p.kamer || '', staat:p.staat || '',
    commissies:Array.isArray(p.commissies) ? p.commissies : []
  }));
  const polById = new Map(pols.map(p => [p.id, p]));
  const trades = (Array.isArray(raw.trades) ? raw.trades : []).map((t, i) => {
    const ticker = String(t.ticker || '?').toUpperCase();
    const H = hist[ticker];
    const tx = String(t.transactiedatum || '').slice(0, 10) || null;
    const mel = String(t.meldingsdatum || '').slice(0, 10) || null;
    const p = polById.get(String(t.politicus_id));
    const pT = num(t.koers_transactie) ?? closeOn(H, tx);
    const pM = num(t.koers_melding) ?? closeOn(H, mel);
    const pN = num(t.koers_nu) ?? (H && H.length ? H[H.length - 1].c : null);
    const rT = pct(pT, pN), rM = pct(pM, pN);
    const type = String(t.type || '').toLowerCase().startsWith('v') ? 'verkoop' : 'koop';
    const dir = rM == null ? null : (type === 'koop' ? rM : -rM);
    const rangeTxt = t.bedrag_range || '–';
    const m = String(rangeTxt).match(/\d[\d.,]*/);
    return {
      id:i, pid:String(t.politicus_id), pol:p, polName:p ? p.naam : 'Onbekend (' + esc(t.politicus_id) + ')',
      partij:p ? p.partij : '', kamer:p ? p.kamer : '', type, ticker, bedrijf:t.bedrijf || '', sector:t.sector || 'Onbekend',
      range:rangeTxt, rangeV:m ? parseInt(m[0].replace(/[.,]/g, ''), 10) : null, tx, mel,
      delay:tx && mel ? daysBetween(tx, mel) : null, pT, pM, pN, rT, rM, dir,
      sig:Array.isArray(t.signalen) ? t.signalen : []
    };
  });
  let ref = raw.laatst_bijgewerkt ? String(raw.laatst_bijgewerkt).slice(0, 10) : null;
  if (!ref || isNaN(toD(ref))) ref = trades.reduce((m, t) => t.mel && t.mel > m ? t.mel : m, '') || iso(new Date());
  return {updated:raw.laatst_bijgewerkt || null, ref, pols, polById, trades, hist};
}

/* ---------- sorting ---------- */
function sortRows(rows, st){
  const k = st.k, d = st.d;
  return rows.slice().sort((a, b) => {
    const x = a[k], y = b[k];
    const xn = x == null || x === '', yn = y == null || y === '';
    if (xn && yn) return 0; if (xn) return 1; if (yn) return -1;
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * d;
    return String(x).localeCompare(String(y), 'nl') * d;
  });
}
function th(label, key, col, right){
  const st = S.sort[key]; const on = st.k === col;
  const arrow = on ? (st.d === 1 ? '▲' : '▼') : '';
  return `<th class="${right ? 'r th-r' : ''}" aria-sort="${on ? (st.d === 1 ? 'ascending' : 'descending') : 'none'}"><button class="sortbtn" type="button" data-sort="${key}|${col}">${esc(label)} <span aria-hidden="true">${arrow}</span></button></th>`;
}

function polStats(p){
  const ts = D.trades.filter(t => t.pid === p.id);
  const withDir = ts.filter(t => t.dir != null);
  const sec = {}; ts.forEach(t => { sec[t.sector] = (sec[t.sector] || 0) + 1; });
  const fav = Object.entries(sec).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]);
  const first = ts.reduce((m, t) => t.tx && (!m || t.tx < m) ? t.tx : m, null);
  const months = first ? Math.max(daysBetween(first, D.ref) / 30.44, 1) : null;
  return {
    p, id:p.id, name:p.naam, kamer:p.kamer, partij:p.partij, trades:ts, n:ts.length,
    win:withDir.length ? withDir.filter(t => t.dir > 0).length / withDir.length * 100 : null,
    winN:withDir.length, avg:mean(withDir.map(t => t.dir)), fav, freq:months ? ts.length / months : null,
    last:ts.reduce((m, t) => t.mel && (!m || t.mel > m) ? t.mel : m, null)
  };
}

    th('Gem. rendement sinds melding', key, 'avg', 1) + '<th>Favoriete sectoren</th><th>Commissies</th>' + th('Frequentie', key, 'freq', 1);
  const body = sorted.map(s => `<tr class="click" tabindex="0" data-pol="${esc(s.id)}" aria-label="Details ${esc(s.name)}">
    <td style="width:44px">${starBtn('pol', s.id, s.name)}</td>

    <td class="r">${s.freq == null ? '–' : fmtNum(s.freq, 1) + ' / mnd'}</td></tr>`).join('');
  return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;

            <div><span>Winstpercentage</span><b>${s.win == null ? '–' : fmtNum(s.win, 0) + '%'}</b></div>
            <div><span>Gem. rendement sinds melding</span><b class="${cls(s.avg)}">${fmtPct(s.avg)}</b></div>
            <div><span>Frequentie</span><b>${s.freq == null ? '–' : fmtNum(s.freq, 1) + ' / mnd'}</b></div>
          </div>
          <div class="mt small"><span class="muted">Commissies:</span> <div class="pills">${p.commissies.map(c => `<span class="pill">${esc(c)}</span>`).join('') || '–'}</div></div>
          <div class="mt small"><span class="muted">Favoriete sectoren:</span> <div class="pills">${s.fav.map(c => `<span class="pill">${esc(c)}</span>`).join('') || '–'}</div></div>
        </div>
        <h3 class="mt">Alle trades (${s.n})</h3>${tradeTable(s.trades, 'detail', {hidePol:true})}${note(WIN_NOTE)}`;
      return;
    }
    S.polDetail = null;
  }
  const stats = D.pols.map(polStats);
  el.innerHTML = `<h2>Politici</h2><p class="small muted" style="margin:-8px 0 12px">Klik op een politicus voor alle trades. Ster = volgen.</p>${polTable(stats, 'pols')}${note(WIN_NOTE)}`;
}

/* ---------- tab: sectoren ---------- */
function renderSectoren(){
  const since = S.secPeriod === 'all' ? null : addDays(D.ref, -parseInt(S.secPeriod, 10));
  const ts = D.trades.filter(t => t.tx && (!since || t.tx >= since));
  const agg = {};
  ts.forEach(t => { const a = agg[t.sector] = agg[t.sector] || {k:0, v:0}; a[t.type === 'koop' ? 'k' : 'v']++; });
  const secs = Object.entries(agg).sort((a, b) => (b[1].k + b[1].v) - (a[1].k + a[1].v));
  const max = Math.max(1, ...secs.map(s => Math.max(s[1].k, s[1].v)));
  const bars = secs.length ? secs.map(([s, a]) => `<div class="row"><div class="small">${esc(s)}</div>
    <div class="bar" role="img" aria-label="${esc(s)}: ${a.k} aankopen, ${a.v} verkopen">
      <div class="flex" style="gap:6px;flex-wrap:nowrap"><span class="b-k" style="width:${a.k / max * 85}%"></span><span class="small">${a.k}</span></div>
      <div class="flex" style="gap:6px;flex-wrap:nowrap"><span class="b-v" style="width:${a.v / max * 85}%"></span><span class="small">${a.v}</span></div>
    </div></div>`).join('') : '<div class="empty">Geen trades in deze periode.</div>';

  // per maand (laatste 12)
  const months = [];
  const refD = toD(D.ref);
  for (let i = 11; i >= 0; i--) { const d = new Date(Date.UTC(refD.getUTCFullYear(), refD.getUTCMonth() - i, 1)); months.push(iso(d).slice(0, 7)); }
  const allSecs = [...new Set(D.trades.map(t => t.sector))].sort((a, b) => a.localeCompare(b, 'nl'));
  const cell = {};
  D.trades.forEach(t => { if (!t.tx) return; const m = t.tx.slice(0, 7); if (!months.includes(m)) return; const key = t.sector + '|' + m; const c = cell[key] = cell[key] || {k:0, v:0}; c[t.type === 'koop' ? 'k' : 'v']++; });
  const maxNet = Math.max(1, ...Object.values(cell).map(c => Math.abs(c.k - c.v)));
  const heatRows = allSecs.map(s => `<tr><td>${esc(s)}</td>${months.map(m => {
    const c = cell[s + '|' + m]; if (!c) return '<td class="muted">·</td>';
    const net = c.k - c.v; const a = Math.round(Math.abs(net) / maxNet * 45) + (net ? 8 : 0);
    const col = net > 0 ? 'var(--koop)' : 'var(--verk)';
    return `<td style="background:color-mix(in srgb, ${col} ${a}%, transparent)" title="${esc(s)} ${m}: ${c.k} koop, ${c.v} verkoop">${c.k}/${c.v}</td>`;
  }).join('')}</tr>`).join('');
  const heat = `<div class="tablewrap"><table class="heat"><thead><tr><th>Sector</th>${months.map(m => `<th>${mfmt.format(toD(m + '-01'))}</th>`).join('')}</tr></thead><tbody>${heatRows}</tbody></table></div>`;

  // verschuiving: laatste 3 maanden vs 3 maanden daarvoor
  const a0 = addDays(D.ref, -91), b0 = addDays(D.ref, -182);
  const share = (from, to) => { const r = D.trades.filter(t => t.tx && t.tx > from && t.tx <= to && t.type === 'koop'); const o = {}; r.forEach(t => { o[t.sector] = (o[t.sector] || 0) + 1; }); const n = r.length; return {o, n}; };
  const now = share(a0, D.ref), prev = share(b0, a0);
  const shifts = allSecs.map(s => {
    const x = now.n ? (now.o[s] || 0) / now.n * 100 : null, y = prev.n ? (prev.o[s] || 0) / prev.n * 100 : null;
    return {s, x, y, d:x != null && y != null ? x - y : null};
  }).filter(r => r.d != null && Math.abs(r.d) >= 0.5).sort((a, b) => b.d - a.d);
  const shiftHtml = shifts.length ? `<ul class="list">${shifts.map(r => `<li class="flex between"><span>${esc(r.s)}</span>
    <span class="small"><span class="muted">${fmtNum(r.y, 0)}% → ${fmtNum(r.x, 0)}%</span> <b class="${r.d > 0 ? 'pos' : 'neg'}">${r.d > 0 ? '+' : '−'}${fmtNum(Math.abs(r.d), 0)} pp</b></span></li>`).join('')}</ul>`
    : '<div class="empty">Te weinig aankopen om verschuivingen te tonen.</div>';

  $('#p-sectoren').innerHTML = `<h2>Sectoren</h2>
    <div class="grid two">
      <div class="card"><div class="flex between" style="margin-bottom:8px"><h3 style="margin:0">Aankopen en verkopen per sector</h3>
        <div class="chips" role="group" aria-label="Periode">${[['90', '90 d'], ['365', '1 jaar'], ['all', 'Alles']].map(o => `<button class="chip" type="button" data-secp="${o[0]}" aria-pressed="${S.secPeriod === o[0]}">${o[1]}</button>`).join('')}</div></div>
        <div class="legend" style="margin-bottom:6px"><span><i style="background:var(--koop)"></i>Aankopen</span><span><i style="background:var(--verk)"></i>Verkopen</span><span>aantal trades</span></div>
        <div class="bars">${bars}</div></div>
      <div class="card"><h3>Verschuiving in aankopen</h3><p class="small muted" style="margin:-6px 0 6px">Aandeel van elke sector in alle aankopen: laatste 3 maanden tegenover de 3 maanden daarvoor (procentpunten).</p>${shiftHtml}</div>
    </div>
    <div class="card mt"><h3>Per maand</h3><p class="small muted" style="margin:-6px 0 10px">Per cel: aantal koop / verkoop (op transactiedatum). Blauw = meer aankopen, oranje = meer verkopen; hoe sterker de kleur, hoe groter het verschil.</p>${heat}</div>
    ${note('<li>Sectorcijfers tellen aantallen trades, niet bedragen, omdat alleen bandbreedtes bekend zijn.</li>')}`;
}

/* ---------- tab: ongebruikelijk ---------- */
function renderOngebruikelijk(){
  const all = D.trades.filter(t => t.sig.length);
  const sigs = [...new Set(all.flatMap(t => t.sig))].sort((a, b) => a.localeCompare(b, 'nl'));
  if (S.sigFilter && !sigs.includes(S.sigFilter)) S.sigFilter = '';
  const rows = S.sigFilter ? all.filter(t => t.sig.includes(S.sigFilter)) : all;
  $('#p-ongebruikelijk').innerHTML = `<h2>Ongebruikelijk</h2>
    <div class="rowbar"><div class="chips" role="group" aria-label="Signaal">
      <button class="chip" type="button" data-sig="" aria-pressed="${!S.sigFilter}">Alle (${all.length})</button>
      ${sigs.map(s => `<button class="chip" type="button" data-sig="${esc(s)}" aria-pressed="${S.sigFilter === s}">${esc(s)} (${all.filter(t => t.sig.includes(s)).length})</button>`).join('')}
    </div><span class="small muted">Standaard: nieuwste melding bovenaan</span></div>
    ${tradeTable(rows, 'unusual', {empty:'Geen trades met signalen.'})}
    ${note('<li>Signalen komen uit het databestand en zijn aanwijzingen, geen bewijs van iets onrechtmatigs.</li>')}`;
}

/* ---------- tab: volglijst ---------- */
function renderVolglijst(){
  const pols = S.watch.pol.map(id => D.polById.get(id)).filter(Boolean);
  const tics = S.watch.tic.slice().sort();
  const rows = D.trades.filter(t => S.watch.pol.includes(t.pid) || S.watch.tic.includes(t.ticker));
  let html = '<h2>Volglijst</h2>';
  if (!pols.length && !tics.length) {
    html += `<div class="card empty">Je volgt nog niemand. Tik op de ster ${ICON.star.replace('<svg', '<svg width="15" height="15" style="vertical-align:-2px"')} bij een politicus (tab Politici) of een ticker (tab Trades) om die hier te zien. Dit wordt alleen in deze browser bewaard.</div>`;
  } else {
    html += `<h3>Politici (${pols.length})</h3>${pols.length ? polTable(pols.map(polStats), 'wpols') : '<div class="card empty">Geen gevolgde politici.</div>'}`;
    html += `<h3 class="mt">Tickers (${tics.length})</h3>`;
    if (tics.length) {
      html += `<div class="tablewrap"><table style="min-width:620px"><thead><tr><th></th><th>Ticker</th><th>Sector</th><th class="r">Koers nu</th><th class="r">Trades</th><th>Laatste melding</th></tr></thead><tbody>${tics.map(tk => {
        const ts = D.trades.filter(t => t.ticker === tk); const H = D.hist[tk];
        const now = H && H.length ? H[H.length - 1].c : (ts.find(t => t.pN) || {}).pN || null;
        const last = ts.reduce((m, t) => t.mel && (!m || t.mel > m) ? t.mel : m, null);
        return `<tr><td style="width:44px">${starBtn('tic', tk, tk)}</td><td><span class="tick">${esc(tk)}</span><div class="small muted">${esc((ts[0] || {}).bedrijf || '')}</div></td>
          <td>${esc((ts[0] || {}).sector || '–')}</td><td class="r">${now ? '$' + fmtNum(now) : '–'}</td><td class="r">${ts.length}</td><td>${fmtDate(last)}</td></tr>`;
      }).join('')}</tbody></table></div>`;
    } else html += '<div class="card empty">Geen gevolgde tickers.</div>';
    html += `<h3 class="mt">Trades van gevolgde politici en tickers (${rows.length})</h3>${tradeTable(rows, 'watch')}`;
  }
  $('#p-volglijst').innerHTML = html + note('<li>Je volglijst staat alleen in deze browser (localStorage) en gaat verloren als je browsergegevens wist.</li>');
}

/* ---------- chart dialog ---------- */
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }
function chartSvg(t){
  const H = D.hist[t.ticker];
  if (!H || H.length < 2 || !t.tx) return `<div class="empty">Geen koershistorie beschikbaar voor ${esc(t.ticker)}.</div>`;
  const base = closeOn(H, t.tx);
  if (!base) return `<div class="empty">Geen koers bekend op de transactiedatum.</div>`;
  const from = addDays(t.tx, -30);
  const s1 = H.filter(x => x.d >= from).map(x => ({d:x.d, v:(x.c / base - 1) * 100}));
  const all = s1;
  const x0 = toD(all.reduce((m, p) => p.d < m ? p.d : m, s1[0].d)).getTime();
  const x1 = toD(all.reduce((m, p) => p.d > m ? p.d : m, s1[0].d)).getTime();
  let y0 = Math.min(0, ...all.map(p => p.v)), y1 = Math.max(0, ...all.map(p => p.v));
  const step = niceStep(Math.max(1, (y1 - y0) / 4)); y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const W = 680, Hh = 310, m = {l:52, r:14, t:36, b:28};
  const X = d => m.l + (toD(d).getTime() - x0) / Math.max(1, x1 - x0) * (W - m.l - m.r);
  const Y = v => m.t + (y1 - v) / Math.max(1e-9, y1 - y0) * (Hh - m.t - m.b);
  const path = s => s.map((p, i) => (i ? 'L' : 'M') + X(p.d).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join('');
  let grid = '';
  for (let v = y0; v <= y1 + 1e-9; v += step) grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${fmtPct(v).replace(',0', '')}</text>`;
  let xt = '';
  for (let i = 0; i < 5; i++) { const ms = x0 + (x1 - x0) * i / 4; const d = iso(new Date(ms)); xt += `<text x="${X(d)}" y="${Hh - 8}" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}">${(x1 - x0 < 150 * DAY ? dmfmt : mfmt).format(new Date(ms))}</text>`; }
  const mk = (d, c, lbl, anchor, row) => d && d >= from ? `<line class="${c}" x1="${X(d)}" x2="${X(d)}" y1="${m.t - 6 + row * 12}" y2="${Hh - m.b}"/><text x="${X(d) + (anchor === 'end' ? -4 : 4)}" y="${m.t - 10 + row * 12}" text-anchor="${anchor}" style="font-weight:600">${lbl}</text>` : '';
  const melAnchor = t.mel && X(t.mel) > W - 90 ? 'end' : 'start';
  const close2 = t.mel && X(t.mel) - X(t.tx) < 80;
  const txAnchor = X(t.tx) > W - 90 ? 'end' : 'start';
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Koersverloop ${esc(t.ticker)} vanaf 30 dagen voor de transactie, geïndexeerd op de transactiedatum">
    <g class="grid">${grid}</g>${xt}
    <line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}"/>
    <path class="l-stock" d="${path(s1)}"/>
    ${mk(t.tx, 'm-tx', 'Transactie', txAnchor, 0)}${mk(t.mel, 'm-mel', 'Melding', melAnchor, close2 ? 1 : 0)}</svg>`;
}
function openTrade(id){
  const t = D.trades[id]; if (!t) return;
  const dlg = $('#dlg');
  const kv = (l, v) => `<div><span>${l}</span><b>${v}</b></div>`;
  dlg.innerHTML = `<div class="dlg-h"><div><h2 id="dlgTitle" style="margin:0">${esc(t.ticker)} <span class="muted" style="font-weight:400;font-size:15px">${esc(t.bedrijf)}</span></h2>
      <div class="small muted">${typePill(t.type)} ${esc(t.polName)} · ${esc(t.range)} · ${esc(t.sector)}</div>${sigPills(t.sig)}</div>
      <button class="iconbtn" type="button" data-close aria-label="Sluiten">${ICON.close}</button></div>
    <div class="dlg-b">
      <div class="chart">${chartSvg(t)}</div>
      <div class="legend" style="margin:6px 0 14px"><span><i style="background:var(--accent)"></i>${esc(t.ticker)}</span><span>0% = slotkoers op de transactiedatum</span></div>
      <div class="kv">
        ${kv('Transactie', fmtDate(t.tx))}${kv('Melding', fmtDate(t.mel) + (t.delay != null ? ` <span class="small muted">(${t.delay} d)</span>` : ''))}
        ${kv('Koers transactie', t.pT ? '$' + fmtNum(t.pT) : '–')}${kv('Koers melding', t.pM ? '$' + fmtNum(t.pM) : '–')}
        ${kv('Koers nu', t.pN ? '$' + fmtNum(t.pN) : '–')}${kv('% sinds transactie', `<span class="${cls(t.rT)}">${fmtPct(t.rT)}</span>`)}
        ${kv('% sinds melding', `<span class="${cls(t.rM)}">${fmtPct(t.rM)}</span>`)}
      </div>
      <p class="small muted" style="margin:14px 0 0">Koersrendement van het aandeel, niet het resultaat van de politicus. Transactiekoers = slotkoers op de transactiedag. Geen beleggingsadvies.</p>
    </div>`;
  if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
}
$('#dlg').addEventListener('click', e => {
  if (e.target.closest('[data-close]') || e.target === e.currentTarget) e.currentTarget.close ? e.currentTarget.close() : e.currentTarget.removeAttribute('open');
});

/* ---------- nav & render ---------- */
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([id, l]) => `<button class="tab" type="button" role="tab" id="t-${id}" aria-controls="p-${id}" aria-selected="${S.tab === id}" data-tab="${id}">${ICON[id]}<span>${l}</span></button>`).join('');
  TABS.forEach(([id]) => { $('#p-' + id).hidden = S.tab !== id; });
}
const R = {overzicht:renderOverzicht, trades:renderTrades, politici:renderPolitici, sectoren:renderSectoren, ongebruikelijk:renderOngebruikelijk, volglijst:renderVolglijst};
function render(){ if (D) R[S.tab](); }
function setTab(id){ S.tab = id; store.set('ct.tab', id); renderTabs(); render(); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]'); if (tab) return setTab(tab.dataset.tab);
  const star = e.target.closest('[data-star]');
  if (star) {
    e.stopPropagation();
    const k = star.dataset.star, id = star.dataset.id, list = S.watch[k];
    const i = list.indexOf(id); if (i >= 0) list.splice(i, 1); else list.push(id);
    store.set('ct.watch', S.watch); render(); return;
  }
  const so = e.target.closest('[data-sort]');
  if (so) {
    const [key, col] = so.dataset.sort.split('|'); const st = S.sort[key];
    if (st.k === col) st.d = -st.d; else { st.k = col; st.d = ['polName', 'ticker', 'sector', 'type', 'name'].includes(col) ? 1 : -1; }
    render(); return;
  }
  if (e.target.closest('[data-reset]')) { S.f = {pol:'', ticker:'', sector:'', type:'', kamer:'', partij:'', periode:'all'}; renderFilters(); renderTrades(); return; }
  if (e.target.closest('[data-back]')) { S.polDetail = null; render(); return; }
  const sp = e.target.closest('[data-secp]'); if (sp) { S.secPeriod = sp.dataset.secp; render(); return; }
  const sg = e.target.closest('[data-sig]'); if (sg) { S.sigFilter = sg.dataset.sig; render(); return; }
  const tr = e.target.closest('[data-trade]'); if (tr && !e.target.closest('dialog')) { openTrade(+tr.dataset.trade); return; }
  const pr = e.target.closest('[data-pol]');
  if (pr) { S.polDetail = pr.dataset.pol; if (S.tab !== 'politici') setTab('politici'); else { render(); window.scrollTo(0, 0); } }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target;
  if (el.matches && el.matches('tr[data-trade], tr[data-pol], .tile[data-trade]')) { e.preventDefault(); el.click(); }
});
document.addEventListener('change', e => {
  const f = e.target.closest('[data-filter]'); if (!f) return;
  S.f[f.dataset.filter] = f.value; renderTrades();
});

/* ---------- load ---------- */
function showBanner(msg){ const b = $('#banner'); b.innerHTML = `<div>${msg}</div>`; b.hidden = false; }
async function load(){
  let raw = null, sample = false, reason = '';
  try {
    const res = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    raw = await res.json();
    if (!raw || !Array.isArray(raw.trades)) throw new Error('onverwachte structuur');
  } catch (err) {
    sample = true; raw = makeSample();
    reason = location.protocol === 'file:' ? ' De pagina is lokaal geopend (file://); de meeste browsers blokkeren dan het inlezen van data.json. Open hem via een (lokale) webserver.' : '';
  }
  D = prepare(raw);
  $('#updated').textContent = 'Laatst bijgewerkt: ' + (D.updated ? fmtUpdated(D.updated) : 'onbekend') + (sample ? ' · voorbeelddata' : '');
  if (sample) showBanner('<b>Voorbeelddata.</b> data.json is niet gevonden of niet leesbaar, dus je ziet fictieve politici, bedrijven en koersen.' + esc(reason));
  renderFilters(); renderTabs(); render();
}
renderTabs();
load();
})();
</script>
