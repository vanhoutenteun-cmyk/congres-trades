<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kapitoolsignaal</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#ffffff;--surface-2:#eef0f3;--surface-3:#f5f6f8;--border:#dde1e6;--line:#eceef1;
  --text:#151a21;--muted:#566170;--accent:#2a56c6;--accent-bg:#eef2fc;--accent-text:#1d3f96;
  --pos:#126b34;--pos-bg:#e3f2e8;--neg:#b0261c;--neg-bg:#fbe9e7;
  --koop:#2a56c6;--koop-bg:#e6ecfa;--verk:#934606;--verk-bg:#fbeee2;--verk-bar:#b85a0a;
  --sig:#7a4a00;--sig-bg:#fdf1dc;--star:#c98a00;--strong-bg:#151a21;--strong:#ffffff;
  --shadow:0 1px 2px rgba(15,20,30,.06);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1115;--surface:#161a20;--surface-2:#222831;--surface-3:#1b2027;--border:#2a313b;--line:#232a33;
    --text:#e6e9ed;--muted:#9ba5b3;--accent:#86a8ff;--accent-bg:#1c2640;--accent-text:#b7c9ff;
    --pos:#5fcf8a;--pos-bg:rgba(95,207,138,.13);--neg:#ff8a7e;--neg-bg:rgba(255,138,126,.13);
    --koop:#86a8ff;--koop-bg:rgba(134,168,255,.15);--verk:#f2a55a;--verk-bg:rgba(242,165,90,.15);--verk-bar:#f2a55a;
    --sig:#f5c26b;--sig-bg:rgba(245,194,107,.14);--star:#f5c542;--strong-bg:#e6e9ed;--strong:#0e1115;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1115;--surface:#161a20;--surface-2:#222831;--surface-3:#1b2027;--border:#2a313b;--line:#232a33;
  --text:#e6e9ed;--muted:#9ba5b3;--accent:#86a8ff;--accent-bg:#1c2640;--accent-text:#b7c9ff;
  --pos:#5fcf8a;--pos-bg:rgba(95,207,138,.13);--neg:#ff8a7e;--neg-bg:rgba(255,138,126,.13);
  --koop:#86a8ff;--koop-bg:rgba(134,168,255,.15);--verk:#f2a55a;--verk-bg:rgba(242,165,90,.15);--verk-bar:#f2a55a;
  --sig:#f5c26b;--sig-bg:rgba(245,194,107,.14);--star:#f5c542;--strong-bg:#e6e9ed;--strong:#0e1115;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
h2{margin:0;font-size:17px}
h3{margin:0;font-size:15px}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:20px}
.brand{font-weight:700;font-size:17px;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tab{display:flex;align-items:center;gap:6px;border:0;background:none;padding:9px 14px;border-radius:8px;color:var(--muted);cursor:pointer;min-height:40px}
.tab svg{width:20px;height:20px;flex:none}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--text);font-weight:600}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-weight:700}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{color:var(--text)}
main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
.banner{max-width:1200px;margin:12px auto 0;padding:0 16px}
.banner div{background:var(--sig-bg);color:var(--sig);border-radius:10px;padding:10px 14px;font-size:14px}
.panel[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.pill{display:inline-block;font-size:12px;line-height:1;padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.sig{background:var(--sig-bg);color:var(--sig)}
.pill.koop{background:var(--koop-bg);color:var(--koop);font-weight:600}
.pill.verkoop{background:var(--verk-bg);color:var(--verk);font-weight:600}
.pill.strong{background:var(--strong-bg);color:var(--strong);font-weight:600}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pct{display:inline-block;padding:3px 7px;border-radius:6px;font-weight:600;white-space:nowrap}
.pct.pos{color:var(--pos);background:var(--pos-bg)}.pct.neg{color:var(--neg);background:var(--neg-bg)}.pct.na{color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(15,20,30,.08)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.dark{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.badge{background:var(--bg);color:var(--text);border-radius:999px;padding:1px 7px;font-size:12px}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:14px;text-decoration:underline}
.star{border:0;background:none;cursor:pointer;color:var(--muted);width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;vertical-align:middle;margin:-8px -4px}
.star:hover{background:var(--surface-2)}
.star svg{width:18px;height:18px}
.star[aria-pressed="true"]{color:var(--star)}
.star[aria-pressed="true"] svg{fill:currentColor}
.foot{margin:28px 0 0;font-size:13px;color:var(--muted)}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}
.cols{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.col-main{flex:999 1 560px;min-width:0}
.col-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile .lbl{font-size:13px;color:var(--muted)}.tile .val{font-size:26px;font-weight:700;line-height:1.25}.tile .sub{font-size:13px;color:var(--muted)}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.wcard{padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.wcard:hover{border-color:var(--accent)}
.mini-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.bars .row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;padding:4px 0;font-size:13px}
.bars span.b{display:block;height:8px;border-radius:3px;min-width:2px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 96px 96px;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.srow:hover,.trow.click:hover,.prow:hover{background:var(--surface-3)}
.srow:focus-visible,.trow:focus-visible,.prow:focus-visible,.wcard:focus-visible,.mini-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.num-col{text-align:right}
.num-col .xs{display:block;margin-bottom:4px}
.tlist{overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(140px,1.2fr) minmax(170px,1.5fr) 110px 130px 96px 96px minmax(150px,1.4fr);
  grid-template-areas:"pol trade amt dates p j sig";gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.trow.click{cursor:pointer}
.trow.head{padding:10px 16px;font-size:12px;font-weight:600;color:var(--muted);cursor:default;border-bottom:1px solid var(--border)}
.c-pol{grid-area:pol;min-width:0}.c-trade{grid-area:trade;min-width:0}.c-amt{grid-area:amt;font-size:14px}.c-dates{grid-area:dates;font-size:14px}
.c-p{grid-area:p;text-align:right}.c-j{grid-area:j;text-align:right}.c-sig{grid-area:sig}
.lbl-m{display:none}
.sortbtn{border:0;background:none;padding:0;font-weight:600;color:inherit;cursor:pointer;font-size:12px;text-align:inherit}
.sortbtn:hover{color:var(--text)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 280px;min-height:44px;border:1px solid var(--border);border-radius:10px;padding:0 14px;background:var(--surface)}
.fpanel{padding:16px;margin-bottom:12px}
.fpanel[hidden]{display:none}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fgrid select{min-height:42px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px;font-size:14px;color:var(--text)}
.fhead{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--accent-bg);color:var(--accent-text);font-size:13px;cursor:pointer}
.backdrop{display:none}
.msort{display:none}
.more{display:flex;justify-content:center;padding:12px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-3)}
.prow{display:grid;grid-template-columns:40px minmax(180px,2fr) 80px 120px 100px 100px 120px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.prow.head{cursor:default;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding:10px 16px}
.prow>.r{text-align:right}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 20px}
.ptabs button{min-height:44px;padding:0 16px;border:0;background:transparent;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
dialog{border:0;border-radius:16px;background:var(--surface);color:var(--text);padding:0;width:min(820px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 10px 40px rgba(15,20,30,.25)}
dialog::backdrop{background:rgba(10,12,16,.5)}
.d-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 24px 0}
.d-b{padding:16px 24px 24px;display:flex;flex-direction:column;gap:16px}
.kv4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kv4>div{background:var(--surface-3);border-radius:10px;padding:10px 12px}
.kv4 .xs{display:block;color:var(--muted)}
.box{border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.kvrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.kvrow:last-child{border-bottom:0}
.kvrow span:first-child{color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chart svg{width:100%;height:auto;display:block}
.chart .grid line{stroke:var(--line)}
.chart text{fill:var(--muted);font-size:11px}
.chart .l-stock{stroke:var(--accent);stroke-width:2;fill:none}
.chart .zero{stroke:var(--muted);stroke-width:1;opacity:.5}
.chart .m-tx{stroke:var(--koop);stroke-width:1.5}
.chart .m-mel{stroke:var(--verk-bar);stroke-width:1.5;stroke-dasharray:3 3}
.chart .m-cij{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4}
.uitleg h3{margin:14px 0 4px}
.uitleg p,.uitleg li{font-size:14px}
.uitleg ul{padding-left:18px;margin:4px 0}
@media (max-width:980px){
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  h1{font-size:24px}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 4px calc(10px + env(safe-area-inset-bottom));z-index:30;gap:0}
  .tab{flex-direction:column;gap:2px;font-size:12px;padding:6px 0;min-height:52px;justify-content:center}
  .tab[aria-selected="true"]{background:none;color:var(--accent)}
  .upd{display:none}
  main{padding:16px 16px 110px}
  .wcards{display:flex;overflow-x:auto;margin:0 -16px;padding:0 16px 4px}
  .wcards .wcard{flex:0 0 210px}
  .srow{grid-template-columns:1fr 1fr;grid-template-areas:"main main" "p j";row-gap:10px}
  .srow .s-main{grid-area:main}.srow .s-p{grid-area:p}.srow .s-j{grid-area:j}
  .num-col{text-align:left;background:var(--surface-3);border-radius:8px;padding:6px 10px}
  .num-col .pct{padding:0;background:transparent}
  .trow{grid-template-columns:1fr 1fr;grid-template-areas:"trade trade" "pol amt" "dates dates" "p j" "sig sig";row-gap:6px;padding:14px}
  .trow.head{display:none}
  .c-amt{text-align:right}
  .c-p,.c-j{text-align:left;background:var(--surface-3);border-radius:8px;padding:6px 10px}
  .c-p .pct,.c-j .pct{padding:0;background:transparent}
  .lbl-m{display:block;font-size:11px;color:var(--muted)}
  .msort{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
  .msort select{min-height:40px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 8px}
  .fpanel{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0;border-radius:16px 16px 0 0;max-height:85vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .backdrop{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:45}
  .backdrop.on{display:block}
  .prow{grid-template-columns:36px 1fr 1fr;grid-template-areas:"star name name" "star goed gem";row-gap:6px}
  .prow.head{display:none}
  .prow .p-star{grid-area:star}.prow .p-name{grid-area:name}.prow .p-goed{grid-area:goed;text-align:left}.prow .p-gem{grid-area:gem;text-align:left}
  .prow .p-n,.prow .p-med,.prow .p-last{display:none}
  dialog{width:100vw;max-width:100vw;max-height:92vh;margin:auto 0 0;border-radius:16px 16px 0 0}
  .d-h{padding:16px 16px 0}.d-b{padding:12px 16px 24px}
  .kv4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand" id="brand">Kapitoolsignaal</div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Tabbladen"></nav>
    <div class="top-r">
      <span class="small muted upd" id="updated"></span>
      <button class="iconbtn" id="uitlegBtn" type="button" aria-label="Uitleg">i</button>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Thema wisselen"></button>
    </div>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<main>
  <section class="panel" id="p-nieuw" role="tabpanel"></section>
  <section class="panel" id="p-trades" role="tabpanel" hidden>
    <h1 style="margin-bottom:16px">Trades</h1>
    <div class="toolbar">
      <label style="display:contents"><span style="position:absolute;left:-9999px">Zoek politicus, ticker of bedrijf</span>
        <input class="search" id="q" type="search" placeholder="Zoek politicus, ticker of bedrijf…" autocomplete="off"></label>
      <button class="btn dark" id="fbtn" type="button" aria-expanded="false" aria-controls="fpanel"></button>
      <div class="seg" id="tview" role="group" aria-label="Weergave"></div>
    </div>
    <div class="backdrop" id="backdrop"></div>
    <div class="card fpanel" id="fpanel" hidden>
      <div class="fhead"><b style="font-size:17px">Filters</b><button class="linkbtn" type="button" data-fclose style="text-decoration:none;font-weight:600">Klaar</button></div>
      <div class="fgrid" id="fgrid"></div>
    </div>
    <div id="fchips" class="chips" style="align-items:center;margin-bottom:12px"></div>
    <div id="tradesOut"></div>
  </section>
  <section class="panel" id="p-politici" role="tabpanel" hidden></section>
  <section class="panel" id="p-volglijst" role="tabpanel" hidden></section>
</main>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<dialog id="uitleg" aria-labelledby="uitlegTitle"></dialog>

<script>
(function(){
'use strict';

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === null || v === undefined || v === '') return null; const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) && n > 0 ? n : null; };
const numAny = v => { if (v === null || v === undefined || v === '') return null; const n = typeof v === 'number' ? v : parseFloat(String(v)); return Number.isFinite(n) ? n : null; };
const pct = (a, b) => (a && b) ? (b / a - 1) * 100 : null;
const DAY = 864e5;
const toD = s => new Date(s + 'T00:00:00Z');
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => iso(new Date(toD(s).getTime() + n * DAY));
const daysBetween = (a, b) => Math.round((toD(b) - toD(a)) / DAY);
const dfmt = new Intl.DateTimeFormat('nl-NL', {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'});
const dsfmt = new Intl.DateTimeFormat('nl-NL', {day:'numeric', month:'short', timeZone:'UTC'});
const fmtDate = s => s ? dfmt.format(toD(s)) : '–';
const fmtShort = s => s ? (s.slice(0, 4) === new Date().toISOString().slice(0, 4) ? dsfmt : dfmt).format(toD(s)) : '–';
const fmtPct = v => v == null ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('nl-NL', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
const fmtNum = (v, d = 2) => v == null ? '–' : v.toLocaleString('nl-NL', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtMoney = v => v == null ? '–' : '$' + fmtNum(v);
const fmtCap = v => { if (!v) return '–'; if (v >= 1e12) return '$' + fmtNum(v / 1e12, 1) + ' biljoen'; if (v >= 1e9) return '$' + fmtNum(v / 1e9, 1) + ' miljard'; return '$' + fmtNum(v / 1e6, 0) + ' miljoen'; };
const cls = v => v == null ? 'na' : v > 0 ? 'pos' : v < 0 ? 'neg' : '';
const pctEl = v => `<span class="pct ${cls(v)}">${fmtPct(v)}</span>`;
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const median = a => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const KAMER = {House:'Huis', Senate:'Senaat'};

function closeOn(arr, date){

  let lo = 0, hi = arr.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (arr[m].d <= date) lo = m; else hi = m - 1; }
  return arr[lo].c;
}

  const minTx = D.trades.reduce((m, t) => t.tx && (!m || t.tx < m) ? t.tx : m, null);
  const firstPT = new Map();
  D.trades.forEach(t => { if (!t.tx) return; const k = t.pid + '|' + t.ticker; if (!firstPT.has(k) || t.tx < firstPT.get(k)) firstPT.set(k, t.tx); });
  D.trades.forEach(t => {
    if (t.type !== 'koop') { t.score = 0; return; }
    t.active = !t.closed;
    t.status = t.closed ? 'verkocht ' + fmtShort(t.closed.tx) : t.partSold ? 'deels verkocht ' + fmtShort(t.partSold) : 'nog in bezit';
    if (minTx && t.tx && t.tx >= addDays(minTx, 365) && firstPT.get(t.pid + '|' + t.ticker) === t.tx && !t.sig.includes('nieuwe positie')) t.sig.push('nieuwe positie');
    if (t.active && t.rT != null && t.rT < 0 && !t.sig.includes('onder koers politicus')) t.sig.push('onder koers politicus');
    t.sig.sort((a, b) => sigRank(a) - sigRank(b));
    t.strong = t.sig.includes('commissie-match') && (t.sig.includes('insider koopt ook') || t.sig.includes('onder koers politicus'));
    t.score = (t.strong ? 100 : 0) + t.sig.length;
  });
  D.roundById = new Map(rounds.map(r => [r.id, r]));
}

/* ================= gedeelde bouwstenen ================= */
function sortRows(rows, st){
  const k = st.k, d = st.d;
  return rows.slice().sort((a, b) => {
    const x = a[k], y = b[k];
    const xn = x == null || x === '', yn = y == null || y === '';
    if (xn && yn) return 0; if (xn) return 1; if (yn) return -1;
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * d;
    return String(x).localeCompare(String(y), 'nl') * d;
  });
}
const isW = (kind, id) => S.watch[kind].includes(id);
function starBtn(kind, id, label){
  const on = isW(kind, id);
  return `<button class="star" type="button" data-star="${kind}" data-id="${esc(id)}" aria-pressed="${on}" aria-label="${on ? 'Niet meer volgen' : 'Volgen'}: ${esc(label)}">${ICON.star}</button>`;
}
const typePill = t => `<span class="pill ${t}">${t === 'koop' ? 'Koop' : 'Verkoop'}</span>`;
function sigPills(sig, max){
  if (!sig.length) return '';

  return `<div class="pills">${shown.map(s => `<span class="pill sig">${esc(s)}</span>`).join('')}${max && sig.length > max ? `<span class="pill">+${sig.length - max}</span>` : ''}</div>`;
}
function sortTh(key, col, label, right){
  const st = S.sort[key]; const on = st.k === col;

}

}

function filterLabel(k, v){

}
function activeFilters(){ return Object.entries(S.f).filter(([k, v]) => v && !(k === 'periode' && v === 'all')); }
function matchQ(x){
  if (!S.q) return true;
  const q = S.q.toLowerCase();
  return (x.ticker || '').toLowerCase().includes(q) || (x.polName || '').toLowerCase().includes(q) || (x.bedrijf || '').toLowerCase().includes(q);

function baseFilter(x, dateKey){

  return {n:vals.length, win:vals.length ? vals.filter(v => v > 0).length / vals.length * 100 : null, avg:mean(vals), med:median(vals)};
}
function polStats(p){
  const ts = D.trades.filter(t => t.pid === p.id);
  const c = hzCalc(ts, S.hz);
  const rs = D.rounds.filter(r => r.pid === p.id), rz = rs.map(r => r.rZ).filter(v => v != null);
  const first = ts.reduce((m, t) => t.tx && (!m || t.tx < m) ? t.tx : m, null);
  const months = first ? Math.max(daysBetween(first, D.ref) / 30.44, 1) : null;
  const sec = {}; ts.forEach(t => { sec[t.sector] = (sec[t.sector] || 0) + 1; });

    fav:Object.entries(sec).sort((a, b) => b[1] - a[1]).slice(0, 4), actief:ts.filter(t => t.active && t.sig.length).length,

/* ================= grafiek en detailvenster ================= */
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }
function chartSvg(t){
  const H = D.hist[t.ticker];
  if (!H || H.length < 2 || !t.tx) return `<div class="empty">Geen koershistorie beschikbaar voor ${esc(t.ticker)}.</div>`;
  const base = closeOn(H, t.tx);
  if (!base) return '<div class="empty">Geen koers bekend op het werkelijke moment.</div>';
  const from = addDays(t.tx, -30);
  const s1 = H.filter(x => x.d >= from).map(x => ({d:x.d, v:(x.c / base - 1) * 100}));
  if (s1.length < 2) return '<div class="empty">Te weinig koersdata voor een grafiek.</div>';
  const x0 = toD(s1[0].d).getTime(); let x1 = toD(s1[s1.length - 1].d).getTime();
  const nextC = (D.cijfers[t.ticker] || []).map(c => c.datum).find(d => d > s1[s1.length - 1].d);
  if (nextC && daysBetween(s1[s1.length - 1].d, nextC) <= 40) x1 = toD(nextC).getTime();
  let y0 = Math.min(0, ...s1.map(p => p.v)), y1 = Math.max(0, ...s1.map(p => p.v));
  const step = niceStep(Math.max(1, (y1 - y0) / 4)); y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const W = 760, Hh = 240, m = {l:52, r:14, t:30, b:26};
  const X = d => m.l + (toD(d).getTime() - x0) / Math.max(1, x1 - x0) * (W - m.l - m.r);
  const Y = v => m.t + (y1 - v) / Math.max(1e-9, y1 - y0) * (Hh - m.t - m.b);
  const path = s1.map((p, i) => (i ? 'L' : 'M') + X(p.d).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join('');
  let grid = '';
  for (let v = y0; v <= y1 + 1e-9; v += step) grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${fmtPct(v).replace(',0', '')}</text>`;
  let xt = '';
  for (let i = 0; i < 5; i++) { const ms = x0 + (x1 - x0) * i / 4; const d = iso(new Date(ms)); xt += `<text x="${X(d)}" y="${Hh - 6}" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}">${dsfmt.format(new Date(ms))}</text>`; }
  const mk = (d, c, lbl, row) => d && d >= from ? `<line class="${c}" x1="${X(d)}" x2="${X(d)}" y1="${m.t - 8 + row * 12}" y2="${Hh - m.b}"/><text x="${X(d) + (X(d) > W - 90 ? -4 : 4)}" y="${m.t - 12 + row * 12}" text-anchor="${X(d) > W - 90 ? 'end' : 'start'}" style="font-weight:600">${lbl}</text>` : '';
  const close2 = t.mel && X(t.mel) - X(t.tx) < 80;
  const showC = nextC && toD(nextC).getTime() <= x1;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Koersverloop ${esc(t.ticker)} vanaf 30 dagen voor het werkelijke moment; 0% is de slotkoers op het werkelijke moment">
    <g class="grid">${grid}</g>${xt}<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}"/><path class="l-stock" d="${path}"/>
    ${mk(t.tx, 'm-tx', 'Werkelijk', 0)}${mk(t.mel, 'm-mel', 'Zichtbaar', close2 ? 1 : 0)}${showC ? mk(nextC, 'm-cij', 'Cijfers', 2) : ''}</svg>`;
}
function insiderBox(t){
  const stats = D.insiderstat[t.ticker] || [];
  const rows = (D.insiders[t.ticker] || []).filter(r => r && r.datum && r.type === 'koop').slice(0, 3);
  if (!stats.length && !rows.length) return '';
  let qq = null;
  if (stats.length && t.tx) {
    const by = new Map(stats.map(r => [r.jaar + '-' + r.kwartaal, r])); const d = toD(t.tx);
    let y = d.getUTCFullYear(), q = Math.floor(d.getUTCMonth() / 3) + 1; qq = 0;
    for (let i = 0; i < 20; i++) { q--; if (!q) { y--; q = 4; } const r = by.get(y + '-' + q); if (!r || r.aankopen > 0) break; qq++; }
  }
  return `<section class="box"><div class="sec-h" style="margin:0 0 6px"><h3>Insiders bij ${esc(t.bedrijf)}</h3>${qq != null && qq >= 4 ? `<span class="pill sig">${qq} kwartalen geen insider-aankoop vóór deze koop</span>` : ''}</div>
    ${stats.length ? `<div class="tablewrap"><table><thead><tr><th>Kwartaal</th><th class="r">Gewone aankopen</th><th class="r">Gewone verkopen</th></tr></thead><tbody>${stats.slice(0, 4).map(r => `<tr><td>Q${r.kwartaal} ${r.jaar}</td><td class="r">${r.aankopen ? `<b class="pos">${r.aankopen}</b>` : 0}</td><td class="r">${r.verkopen}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${rows.length ? `<p class="small muted" style="margin:8px 0 0">Laatste aankopen: ${rows.map(r => `${esc(r.naam)}${r.rol ? ' (' + esc(String(r.rol).replace(/^officer:\s*/i, '')) + ')' : ''} kocht ${num(r.aantal) ? Math.round(num(r.aantal)).toLocaleString('nl-NL') + ' aandelen' : ''}${num(r.prijs) ? ' à ' + fmtMoney(num(r.prijs)) : ''} op ${fmtShort(String(r.datum).slice(0, 10))}`).join(' · ')}</p>` : ''}</section>`;
}
function cijfersBox(t){
  const cs = D.cijfers[t.ticker] || [];
  if (!cs.length) return '';
  const next = cs.find(c => c.datum >= D.ref);
  const prev = cs.slice().reverse().find(c => c.datum < D.ref && numAny(c.eps) != null);
  const ev = prev ? numAny(prev.eps) : null, ee = prev ? numAny(prev.epsVerwacht) : null;
  return `<section class="box"><h3 style="margin-bottom:6px">Kwartaalcijfers</h3>
    <div class="kvrow"><span>Volgende cijfers</span><b>${next ? fmtDate(next.datum) + ' · over ' + daysBetween(D.ref, next.datum) + ' d' : 'onbekend'}</b></div>
    ${t.cijfersNa && t.type === 'koop' ? `<div class="kvrow"><span>Politicus kocht</span><b>${daysBetween(t.tx, t.cijfersNa)} dagen voor de cijfers van ${fmtShort(t.cijfersNa)}</b></div>` : ''}
    <div class="kvrow"><span>Vorige keer${prev ? ' (' + fmtShort(prev.datum) + ')' : ''}</span><b>${ev == null || ee == null ? '–' : ev >= ee ? 'verwachting gehaald' : 'verwachting gemist'}</b></div>
    ${ev != null && ee != null ? `<p class="small muted" style="margin:4px 0 0">winst per aandeel ${fmtMoney(ev)} tegen ${fmtMoney(ee)} verwacht</p>` : ''}</section>`;
}
function bedrijfBox(t){
  const b = D.bedrijven[t.ticker] || {};
  if (!b.marktwaarde && !b.industrie) return '';
  return `<section class="box"><h3 style="margin-bottom:6px">Bedrijf</h3>
    <div class="kvrow"><span>Marktwaarde</span><b>${fmtCap(b.marktwaarde)}</b></div>
    <div class="kvrow"><span>Grootte</span><b>${!b.marktwaarde ? '–' : b.marktwaarde < 2e9 ? 'klein bedrijf (&lt; $2 mrd)' : b.marktwaarde < 10e9 ? 'middelgroot' : 'groot'}</b></div>
    <div class="kvrow"><span>Sector</span><b>${esc(t.sector)}${b.industrie ? ' · ' + esc(b.industrie) : ''}</b></div>
    ${b.marktwaarde && b.marktwaarde < 2e9 ? '<p class="small muted" style="margin:4px 0 0">Bij kleine bedrijven valt een aankoop van een politicus meer op dan bij een reus als Apple.</p>' : ''}</section>`;
}
function nieuwsBox(t){
  const ns = (D.nieuws[t.ticker] || []).slice(0, 3);
  if (!ns.length) return '';
  return `<section class="box"><h3 style="margin-bottom:4px">Nieuws</h3>${ns.map(n => `<div class="kvrow" style="display:block">${n.url && /^https?:/.test(n.url) ? `<a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer" style="font-weight:600;text-decoration:none">${esc(n.titel)}</a>` : `<b>${esc(n.titel)}</b>`}<div class="small muted">${esc(n.bron)} · ${fmtShort(n.datum)}</div></div>`).join('')}</section>`;
}
function roundBox(t){
  const rs = t.round ? [t.round] : (t.rounds || []);
  if (!rs.length) return '';
  return `<section class="box"><h3 style="margin-bottom:4px">${rs.length === 1 ? 'Ronde' : rs.length + ' rondes'} (koop → verkoop)</h3>${rs.map(r => `<div class="kvrow" style="display:block"><span class="small">Gekocht ${fmtShort(r.buyTx)}${r.nBuys > 1 ? ' (' + r.nBuys + ' aankopen)' : ''} → verkocht ${fmtShort(r.saleTx)} · ${r.days} dagen · ${esc(r.kind)}</span><div class="small" style="margin-top:4px">Politicus ${pctEl(r.rW)} · Jij ${pctEl(r.rZ)}</div></div>`).join('')}</section>`;
}
function openTrade(id){
  const t = D.trades[id]; if (!t) return;
  const dlg = $('#dlg');
  const sigs = t.sig.map(s => s === 'commissie-match' && t.cm ? 'commissie-match · ' + t.cm : s);
  const two = cijfersBox(t) + bedrijfBox(t);
  dlg.innerHTML = `<div class="d-h"><div style="min-width:0">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${t.strong ? '<span class="pill strong">sterk</span>' : ''}<h2 id="dlgTitle" style="font-size:24px">${esc(t.ticker)}</h2><span class="muted">${esc(t.bedrijf)}</span>${starBtn('tic', t.ticker, t.ticker)}</div>
      <div class="small muted" style="margin-top:4px">${typePill(t.type)} ${esc(t.polName)} (${esc(polMeta(t.pol))}) · ${esc(t.rangeFull)}${t.status ? ` · <b style="color:${t.status === 'nog in bezit' ? 'var(--pos)' : 'var(--muted)'}">${esc(t.status)}</b>` : ''}</div></div>
      <button class="iconbtn" type="button" data-close aria-label="Sluiten">×</button></div>
    <div class="d-b">
      ${sigs.length ? `<div class="pills">${sigs.map(s => `<span class="pill sig">${esc(s)}</span>`).join('')}</div>` : ''}
      <div class="kv4">
        <div><span class="xs">Werkelijk moment</span><b>${fmtDate(t.tx)}</b><span class="xs">slotkoers ${fmtMoney(t.pT)}</span></div>
        <div><span class="xs">Zichtbaar moment</span><b>${fmtDate(t.mel)}</b><span class="xs">slotkoers ${fmtMoney(t.pM)}${t.delay != null ? ' · ' + t.delay + ' d later' : ''}</span></div>
        <div><span class="xs">Politicus</span>${pctEl(t.rT)}<span class="xs">koers nu ${fmtMoney(t.pN)}</span></div>
        <div><span class="xs">Jij</span>${pctEl(t.rM)}<span class="xs">vanaf zichtbaar</span></div></div>
      <div class="chart" id="chartBox">${needsLoad(t) ? '<div class="empty">Koersgrafiek laden…</div>' : chartSvg(t)}</div>
      ${two ? `<div class="two">${two}</div>` : ''}
      ${insiderBox(t)}${nieuwsBox(t)}${roundBox(t)}
      ${t.link && /^https?:/.test(t.link) ? `<p class="small" style="margin:0"><a href="${esc(t.link)}" target="_blank" rel="noopener noreferrer">Originele melding bekijken</a></p>` : ''}
      <p class="xs muted" style="margin:0">Rendement = koers van het aandeel, niet het resultaat van de politicus · geen beleggingsadvies</p>
    </div>`;
  if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
  dlg.scrollTop = 0;
  dlg.dataset.trade = String(id);
  if (needsLoad(t)) loadHist(t.ticker).then(() => { const box = $('#chartBox'); if (box && dlg.open && dlg.dataset.trade === String(id)) box.innerHTML = chartSvg(t); });
}
function needsLoad(t){ return D.histDir && !D.hist[t.ticker] && !D.histTried.has(t.ticker); }
async function loadHist(tk){
  D.histTried.add(tk);
  try {
    const file = tk.toUpperCase().replace(/[^A-Z0-9.\-]/g, '_');
    const res = await fetch(D.histDir + encodeURIComponent(file) + '.json?t=' + encodeURIComponent(D.updated || Date.now()));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    D.hist[tk] = normH(await res.json());
  } catch (e) { /* geen koersbestand */ }
}
['dlg', 'uitleg'].forEach(id => $('#' + id).addEventListener('click', e => {
  if (e.target.closest('[data-close]') || e.target === e.currentTarget) e.currentTarget.close ? e.currentTarget.close() : e.currentTarget.removeAttribute('open');
}));

/* ================= uitleg ================= */
function openUitleg(){
  const u = $('#uitleg');
  u.innerHTML = `<div class="d-h"><h2 id="uitlegTitle" style="font-size:22px">Uitleg</h2><button class="iconbtn" type="button" data-close aria-label="Sluiten">×</button></div>
  <div class="d-b uitleg">
    <h3>Werkelijk en zichtbaar moment</h3>
    <p><b>Werkelijk moment</b> = de transactiedatum: wanneer de politicus handelde. <b>Zichtbaar moment</b> = de meldingsdatum: wanneer jij de trade kon zien. Meldingen komen tot 45 dagen na de trade binnen (soms later). <b>Politicus</b> = koers nu tegenover de slotkoers op het werkelijke moment. <b>Jij</b> = koers nu tegenover het zichtbare moment; dat had je als volger in de praktijk kunnen halen.</p>
    <h3>Koopsignalen</h3>
    <p>Signalen staan alleen bij aankopen. Een koopsignaal is <b>actief</b> zolang de politicus het aandeel nog heeft. Verkoopt de politicus, dan vervalt het signaal. Bij een deelverkoop blijft het actief, met het label “deels verkocht”.</p>
    <ul>
      <li><b>Commissie-match</b>: de politicus zit in een commissie die over de sector of branche van het bedrijf gaat. Grove indeling op basis van de huidige commissies; controleer zelf.</li>
      <li><b>Insider koopt ook</b>: een bestuurder, commissaris of grootaandeelhouder van het bedrijf kocht binnen 30 dagen ook (alleen gewone aankopen, geen opties of toekenningen). <b>Eerste insider-aankoop in X jaar</b>: daarvoor kochten insiders lange tijd niet.</li>
      <li><b>Onder koers politicus</b>: het aandeel staat nu lager dan op het werkelijke moment, dus je kunt goedkoper instappen dan de politicus. Een koers kan ook om een goede reden gedaald zijn; kijk naar het nieuws.</li>
      <li><b>Koop vlak voor cijfers</b>: gekocht binnen 30 dagen vóór de kwartaalcijfers.</li>
      <li><b>Cluster kopen</b>: andere politici kochten binnen 14 dagen hetzelfde aandeel (gemengd: niet allemaal kopen).</li>
      <li><b>Klein bedrijf</b>: marktwaarde onder $2 miljard. <b>Groot bedrag</b>: ondergrens van de bandbreedte vanaf $250.001. <b>Nieuwe positie</b>: de eerste aankoop van dit aandeel door deze politicus in de data. <b>Late melding</b>: meer dan 45 dagen na de trade gemeld.</li>
      <li><b>Sterk</b>: commissie-match én (insider koopt ook of onder koers politicus).</li>
    </ul>
    <h3>Rondes</h3>
    <p>Per politicus, aandeel en eigenaar (zelf, partner, gezamenlijk) koppelen we elke verkoop aan de eerdere aankopen die nog openstonden. Een volledige verkoop of een verkoop met onbekende omvang sluit ze af; een deelverkoop niet. Bij meerdere aankopen gebruiken we de gemiddelde slotkoers.</p>
    <h3>Track record</h3>
    <p>Gemeten vanaf het zichtbare moment. Bij kopen telt een koersstijging als “goede kant op”, bij verkopen een daling. Aandelen stijgen op lange termijn vaker dan ze dalen, dus bij kopen ligt dit al snel boven 50%. Kleine aantallen zeggen weinig.</p>
    <h3>Goed om te weten</h3>
    <ul><li>Bedragen zijn bandbreedtes zoals gemeld, geen exacte bedragen.</li><li>Rendement is het koersrendement van het aandeel, niet het exacte resultaat van de politicus. De koers op een moment is de slotkoers van die dag.</li>
      <li>Alleen huidige Congresleden; opties en obligaties tellen niet mee. ETF's staan erin met een label.</li><li>Je volglijst en je vorige bezoek worden alleen in deze browser bewaard.</li>
      <li>Signalen zijn aanwijzingen om verder te kijken, geen bewijs van iets onrechtmatigs en geen beleggingsadvies.</li></ul>
  </div>`;
  if (typeof u.showModal === 'function') u.showModal(); else u.setAttribute('open', '');
}
$('#uitlegBtn').addEventListener('click', openUitleg);

/* ================= navigatie en events ================= */
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([id, l]) => `<button class="tab" type="button" role="tab" aria-controls="p-${id}" aria-selected="${S.tab === id}" data-tab="${id}">${ICON[id]}<span>${l}</span></button>`).join('');
  TABS.forEach(([id]) => { $('#p-' + id).hidden = S.tab !== id; });
}
const R = {nieuw:renderNieuw, trades:renderTrades, politici:renderPolitici, volglijst:renderVolglijst};
function render(){ if (D) R[S.tab](); }
function setTab(id){ S.tab = id; store.set('ks.tab', id); if (id !== 'trades') { S.fopen = false; $('#backdrop').classList.remove('on'); } renderTabs(); render(); window.scrollTo(0, 0); }
function closeDialogs(){ ['dlg', 'uitleg'].forEach(id => { const d = $('#' + id); if (d.open) d.close ? d.close() : d.removeAttribute('open'); }); }

document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('[data-tab]'); if (tab) { closeDialogs(); return setTab(tab.dataset.tab); }
  if (t.closest('[data-uitleg]')) return openUitleg();
  const star = t.closest('[data-star]');
  if (star) {
    e.stopPropagation();
    const k = star.dataset.star, id = star.dataset.id, list = S.watch[k];
    const i = list.indexOf(id); if (i >= 0) list.splice(i, 1); else list.push(id);
    store.set('ks.watch', S.watch);
    star.setAttribute('aria-pressed', String(list.includes(id)));
    if (!t.closest('dialog')) render();
    return;
  }
  const so = t.closest('[data-sort]');
  if (so) {
    const [key, col] = so.dataset.sort.split('|'); const st = S.sort[key];
    if (st.k === col) st.d = -st.d; else { st.k = col; st.d = ['polName', 'ticker', 'name'].includes(col) ? 1 : -1; }
    render(); return;
  }
  const np = t.closest('[data-nperiod]'); if (np) { S.nperiod = np.dataset.nperiod; render(); return; }
  if (t.closest('[data-goto-signals]')) { S.f = F0(); S.f.sig = 'actief'; S.q = ''; $('#q').value = ''; S.tview = 'trades'; S.sort.trades = {k:'score', d:-1}; renderFilters(); setTab('trades'); return; }
  const srch = t.closest('[data-search]'); if (srch) { S.q = srch.dataset.search; $('#q').value = S.q; S.tview = 'trades'; setTab('trades'); return; }
  if (t.closest('#fbtn')) { S.fopen = !S.fopen; renderTradesControls(); return; }
  if (t.closest('[data-fclose]') || t.id === 'backdrop') { S.fopen = false; renderTradesControls(); return; }
  const unf = t.closest('[data-unf]'); if (unf) { S.f[unf.dataset.unf] = unf.dataset.unf === 'periode' ? 'all' : ''; renderFilters(); renderTrades(); return; }
  if (t.closest('[data-reset]')) { S.f = F0(); renderFilters(); renderTrades(); return; }
  const tv = t.closest('[data-tview]'); if (tv) { S.tview = tv.dataset.tview; renderTrades(); return; }
  const mo = t.closest('[data-more]'); if (mo) { const k = mo.dataset.more; S.lim[k] = (S.lim[k] || 100) + 100; render(); return; }
  if (t.closest('[data-back]')) { S.polDetail = null; render(); window.scrollTo(0, 0); return; }
  const pt = t.closest('[data-ptab]'); if (pt) { S.ptab = pt.dataset.ptab; render(); return; }
  const trb = t.closest('[data-trt]'); if (trb) { S.trType = trb.dataset.trt; render(); return; }
  if (t.closest('dialog')) return;
  const rr = t.closest('[data-round]'); if (rr) { const r = D.roundById.get(+rr.dataset.round); if (r) openTrade(r.sale.id); return; }
  const op = t.closest('[data-openpos]'); if (op) { const o = D.open[+op.dataset.openpos]; if (o) openTrade(o.buys[o.buys.length - 1].id); return; }
  const tr = t.closest('[data-trade]'); if (tr) { openTrade(+tr.dataset.trade); return; }
  const pr = t.closest('[data-pol]'); if (pr) { S.polDetail = pr.dataset.pol; S.ptab = 'overzicht'; if (S.tab !== 'politici') setTab('politici'); else { render(); window.scrollTo(0, 0); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.fopen) { S.fopen = false; renderTradesControls(); return; }
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target;
  if (el.matches && el.matches('[role="button"][data-trade], [role="button"][data-pol], [role="button"][data-search], [role="button"][data-openpos], tr[data-round], tr[data-openpos]')) { e.preventDefault(); el.click(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'minN') { S.minN = t.checked; render(); return; }
  if (t.matches('[data-hzsel]')) { S.hz = t.value; render(); return; }
  if (t.matches('[data-trtsel]')) { S.trType = t.value; render(); return; }
  if (t.matches('[data-msort]')) { const k = t.dataset.msort; S.sort[k] = {k:t.value, d:['polName', 'ticker'].includes(t.value) ? 1 : -1}; render(); return; }
  const f = t.closest('[data-filter]'); if (f) { S.f[f.dataset.filter] = f.value; renderTrades(); }
});
let qTimer = null;
document.addEventListener('input', e => {
  if (e.target.id === 'q') { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = e.target.value.trim(); renderTrades(); }, 150); }
  if (e.target.id === 'pq') { clearTimeout(qTimer); const pos = e.target.selectionStart; qTimer = setTimeout(() => { S.pq = e.target.value.trim(); renderPolitici(); const el = $('#pq'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} } }, 200); }
});

/* ================= laden ================= */
function fmtUpdated(v){
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  return new Intl.DateTimeFormat('nl-NL', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}).format(d);
}
async function load(){
  let raw = null, sample = false, reason = '';
  try {
    const res = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    raw = await res.json();
    if (!raw || !Array.isArray(raw.trades)) throw new Error('onverwachte structuur');
  } catch (err) {
    sample = true; raw = makeSample();
    reason = location.protocol === 'file:' ? ' De pagina is lokaal geopend (file://); browsers blokkeren dan het inlezen van data.json.' : '';
  }
  D = prepare(raw);
  buildRounds();
  $('#updated').textContent = 'Bijgewerkt ' + (D.updated ? fmtUpdated(D.updated) : 'onbekend');
  if (sample) { const b = $('#banner'); b.innerHTML = `<div><b>Voorbeelddata.</b> data.json is niet gevonden of niet leesbaar, dus je ziet fictieve politici, bedrijven en koersen.${esc(reason)}</div>`; b.hidden = false; }
  renderFilters(); renderTabs(); render();
}
renderTabs();
load();
})();
</script>
</body>
